name: package-contracts
on:
  push:
    paths: ['tools/package/**', 'tools/lab/**', 'build/VStudio/installer/**', '.github/workflows/package-contracts.yml']
  pull_request:
    paths: ['tools/package/**', 'tools/lab/**', 'build/VStudio/installer/**', '.github/workflows/package-contracts.yml']
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lab/go.mod
          cache-dependency-path: tools/lab/go.sum
      - name: Check harness and cached-payload compatibility without starting VMs
        working-directory: tools/lab
        env:
          GOWORK: 'off'
        run: go test -race -count=1 ./...
  inputs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unsafe and incomplete package inputs
        shell: pwsh
        run: ./tools/package/inputs-test.ps1
      - name: Verify ranged toolchain download checks
        run: python -m unittest discover -s tools/package -p test_fetch_ewdk.py -v
      - name: Check native log streaming and evidence interpretation
        shell: pwsh
        run: |
          ./tools/lab/process-test.ps1
          ./tools/lab/evidence-test.ps1
      - name: Test with the Windows PowerShell used by the guest harness
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tools/package/inputs-test.ps1
          ./tools/lab/process-test.ps1
          ./tools/lab/evidence-test.ps1

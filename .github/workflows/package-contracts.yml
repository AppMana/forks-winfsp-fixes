name: package-contracts
on:
  push:
    paths: ['tools/package/**', '.github/workflows/package-contracts.yml']
  pull_request:
    paths: ['tools/package/**', '.github/workflows/package-contracts.yml']
permissions:
  contents: read
jobs:
  inputs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unsafe and incomplete package inputs
        shell: pwsh
        run: ./tools/package/inputs-test.ps1
      - name: Verify ranged toolchain download checks
        run: python -m unittest discover -s tools/package -p test_fetch_ewdk.py -v
      - name: Test with the Windows PowerShell used by the guest harness
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/package/inputs-test.ps1

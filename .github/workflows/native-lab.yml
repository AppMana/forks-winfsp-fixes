name: native-lab
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winfsp-native-lab
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicitly configured isolated lab
        env:
          LABELS: ${{ vars.WINFSP_LAB_RUNNER_LABELS }}
          EWDK: ${{ vars.WINFSP_LAB_EWDK_ISO }}
          MSI: ${{ vars.WINFSP_LAB_MSI }}
          LABD: ${{ vars.LABCONTAINERS_LABD }}
          IMAGE: ${{ vars.LABCONTAINERS_WINDOWS_IMAGE }}
          RESULTS: ${{ vars.WINFSP_LAB_RESULTS }}
        run: |
          test -n "$LABELS" && test -n "$EWDK" && test -n "$MSI"
          test -n "$LABD" && test -n "$IMAGE" && test -n "$RESULTS"
          jq -en --argjson labels "$LABELS" '$labels | type == "array" and length > 0'
  qualify:
    needs: configuration
    runs-on: ${{ fromJSON(vars.WINFSP_LAB_RUNNER_LABELS || '["self-hosted","winfsp-lab-unconfigured"]') }}
    timeout-minutes: 130
    env:
      GOWORK: 'off'
      WINFSP_LAB_LIVE: '1'
      WINFSP_LAB_EWDK_ISO: ${{ vars.WINFSP_LAB_EWDK_ISO }}
      SEAWEEDFS_WINFSP_MSI: ${{ vars.WINFSP_LAB_MSI }}
      LABCONTAINERS_LABD: ${{ vars.LABCONTAINERS_LABD }}
      LABCONTAINERS_WINDOWS_IMAGE: ${{ vars.LABCONTAINERS_WINDOWS_IMAGE }}
      RUNNER_TEMP: ${{ vars.WINFSP_LAB_RESULTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test evidence parser
        run: pwsh -NoProfile -File tools/lab/evidence-test.ps1
      - name: Test native process status and deadline
        run: pwsh -NoProfile -File tools/lab/process-test.ps1
      - name: Real Windows VM qualification
        working-directory: tools/lab
        run: go test -v -count=1 -timeout=120m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winfsp-native-evidence
          path: ${{ vars.WINFSP_LAB_RESULTS }}/winfsp-native-*/
          if-no-files-found: error
